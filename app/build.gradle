plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.at200.browser'
    compileSdk 34

    defaultConfig {
        applicationId "ua.at200.browser"
        minSdk 15
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
